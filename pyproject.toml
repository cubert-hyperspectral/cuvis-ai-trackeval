[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "cuvis-ai-trackeval"
dynamic = ["version"]
description = "TrackEval tracking-metric evaluation library with a cuvis.ai-compatible plugin package."
readme = "Readme.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [
    { name = "Jonathon Luiten, Arne Hoffhues" },
    { name = "Cubert GmbH, Ulm, Germany", email = "cuvis.ai@cubert-gmbh.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
keywords = [
    "cuvis",
    "tracking",
    "evaluation",
    "HOTA",
    "MOTA",
    "IDF1",
    "multi-object-tracking",
    "computer-vision",
    "plugin",
]
dependencies = [
    "cuvis-ai-schemas>=0.7.0",
    "cuvis-ai-core>=0.10.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "tabulate>=0.9",
    "tqdm>=4.64",
    "click>=8.1",
]

[project.optional-dependencies]
plots = [
    "matplotlib>=3.7",
    "opencv-python-headless>=4.8",
    "scikit-image>=0.21",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "ipython",
    "interrogate>=1.5.0",
    "twine>=6.2.0",
    "pip-audit>=2.7.0",
    "bandit[toml]>=1.7.0",
    "detect-secrets>=1.4.0",
    "pip-licenses>=4.0.0",
    "cyclonedx-bom>=4.0.0",
]

[project.scripts]
trackeval-cuvis = "cuvis_ai_trackeval.cli.evaluate:main"

[project.urls]
Homepage = "https://www.cubert-hyperspectral.com/"
Repository = "https://github.com/cubert-hyperspectral/cuvis-ai-trackeval"

[tool.setuptools.packages.find]
include = ["trackeval*", "cuvis_ai_trackeval*"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-date"

[dependency-groups]
dev = ["setuptools-scm>=9.2.2"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["trackeval", "scripts/run_*.py", "examples"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
extend-select = ["ANN201", "ANN202", "ANN204"]
ignore = ["ANN401", "E501"]

[tool.ruff.lint.per-file-ignores]
"trackeval/**" = ["ALL"]
"scripts/run_*.py" = ["ALL"]
"examples/**" = ["ALL"]
"tests/**" = ["ANN201", "ANN202", "ANN204"]

[tool.pytest.ini_options]
addopts = "-v -ra --showlocals --strict-markers --tb=short --color=yes"
testpaths = ["tests"]
xfail_strict = true
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
norecursedirs = ".* build dist trackeval __pycache__ node_modules .git .venv"
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests across multiple components",
    "slow: Tests that take significant time to run",
    "gpu: Tests that require GPU hardware",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
log_cli = false
log_cli_level = "INFO"
minversion = "7.0"

[tool.bandit]
exclude_dirs = ["tests", "trackeval", "examples"]
skips = ["B101"]

[tool.interrogate]
ignore-init-method = true
fail-under = 80.0
exclude = ["setup.py", "docs", "build", "tests", "trackeval", "scripts/run_*.py", "examples"]
verbose = 2

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests", "build", "dist", "trackeval", "examples"]

[[tool.mypy.overrides]]
module = "trackeval.*"
follow_imports = "skip"
